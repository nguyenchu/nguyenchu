# nginx site for nguyenchu.com and www.nguyenchu.com
#
# Installed on the server as /etc/nginx/sites-available/nguyenchu.com
# (symlinked from sites-enabled). Serves the portfolio from /var/www/html,
# the Matkupp data under /matkupp/ and Themepark under /themepark/.
#
# RECONSTRUCTED: this file was rebuilt from the server inventory of
# 2026-11-09, not copied from the server. Compare it with the live file
# before installing it (see SITE.md, "nginx"), and replace this note once
# the two match.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nguyenchu.com www.nguyenchu.com;

    ssl_certificate /etc/letsencrypt/live/nguyenchu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nguyenchu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    # Send /index.html (and /index.html?query) to /. This checks the address
    # the visitor asked for: when nginx serves index.html for "/" internally,
    # $request_uri is still "/", so this does not loop. Fragments such as
    # #kontakt stay in the browser and survive the redirect.
    if ($request_uri ~ "^/index\.html(?:\?|$)") {
        return 301 /$is_args$args;
    }

    # Themepark: save endpoints go to the Node service, everything else is static.
    location /themepark/save {
        proxy_pass http://127.0.0.1:5130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /themepark/savefile {
        proxy_pass http://127.0.0.1:5130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /themepark {
        return 301 /themepark/;
    }

    location ^~ /themepark/ {
        alias /var/www/themepark/;
        try_files $uri $uri/ =404;
    }

    # Matkupp product data, published by the Matkupp sync job.
    location /matkupp/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name nguyenchu.com www.nguyenchu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
