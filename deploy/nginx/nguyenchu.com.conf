# nginx site for nguyenchu.com and www.nguyenchu.com
#
# Installed on the server as /etc/nginx/sites-available/nguyenchu.com
# (symlinked from sites-enabled). Serves the portfolio from /var/www/html,
# the Matkupp data under /matkupp/ and Themepark under /themepark/.
# Copied from the server on 2026-11-17; the only change is the
# /index.html redirect.

server {
    listen 80;
    server_name nguyenchu.com www.nguyenchu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nguyenchu.com www.nguyenchu.com;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/nguyenchu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nguyenchu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Send /index.html (and /index.html?query) to /. This checks the address
    # the visitor asked for: when nginx serves index.html for "/" or as the
    # try_files fallback, $request_uri is unchanged, so this does not loop.
    # Fragments such as #kontakt stay in the browser and survive the redirect.
    if ($request_uri ~ "^/index\.html(?:\?|$)") {
        return 301 /$is_args$args;
    }

    location /themepark/save {
        proxy_pass http://127.0.0.1:5130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /themepark/savefile {
        proxy_pass http://127.0.0.1:5130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /themepark {
        return 301 /themepark/;
    }

    location ^~ /themepark/ {
        alias /var/www/themepark/;
        try_files $uri $uri/ /themepark/index.html;
    }

    location /matkupp/ {
        # Katalogen mobilappen leser (~1,9 MB). gzip_types er kommentert ut i
        # nginx.conf, så JSON må slås på her. Ingen CORS: native-appen trenger
        # det ikke, og webappen leser fra matkupp.nguyenchu.com/products.json.
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_vary on;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
